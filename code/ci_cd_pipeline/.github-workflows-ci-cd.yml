name: Enterprise CI/CD Pipeline with Quality & Security Gates

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Code Quality & SAST Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Flake8 Linter
        run: |
          pip install flake8
          flake8 app.py --max-line-length=120
      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r app.py

  unit-and-integration-tests:
    name: Automated Testing Gate
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Pytest with Coverage Gate (>=80%)
        run: |
          pytest --cov=app --cov-report=xml --cov-fail-under=80 test_app.py

  container-vulnerability-scan:
    name: Container Security Gate (Trivy)
    needs: unit-and-integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t payment-service:${{ github.sha }} .
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'payment-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  deploy-to-staging:
    name: Gated Staging Deployment
    needs: container-vulnerability-scan
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Staging Deploy
        run: |
          echo "All gates passed! Promoting artifact payment-service:${{ github.sha }} to Staging."

